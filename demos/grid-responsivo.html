<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS layout responsivo - Ana Gabriela Nobre</title>
    <style>
      .contentor > * {
        background-color: plum;
        padding: 20px;
        font-size: 2rem;
      }

      header {
        grid-area: header;
      }
      nav {
        grid-area: menu;
      }
      main {
        grid-area: main;
      }
      aside {
        grid-area: aside;
      }
      footer {
        grid-area: footer;
      }

      div.contentor {
        margin: 20px;
        height: 600px;
        background-color: purple;
        display: grid;

        grid-template-areas:
          "header header header"
          "menu   main   aside"
          "menu   footer footer";
        gap: 10px;
        padding: 10px;

        grid-template-columns: 20vw 3fr 2fr;
        grid-template-rows: 15vh 1fr 60px;
      }

      /* no telemóvel: tudo numa coluna e com outra cor */
      @media (max-width: 600px) {
        div.contentor {
          height: 900px;
          background-color: khaki;
          grid-template-areas:
            "header"
            "menu"
            "main"
            "aside"
            "footer";
          grid-template-columns: auto;
          grid-template-rows: 15vh 10vh 2fr 1fr 60px;
        }

        .contentor > * {
          background-color: lemonchiffon;
        }
      }
    </style>
  </head>
  <body>
    <div class="contentor">
      <header>título</header>
      <nav>menu</nav>
      <main>conteúdo</main>
      <aside>info</aside>
      <footer>Ana Gabriela Nobre</footer>
    </div>
  </body>
</html>
